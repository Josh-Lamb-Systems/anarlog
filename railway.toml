# Railway config for the anarlog community API (apps/api).
#
# Place this at the REPOSITORY ROOT, not in apps/api.
# The Dockerfile COPYs Cargo.toml, crates/, and packages/pricing from the repo
# root, so the build context must be the root. In the Railway service settings
# leave "Root Directory" empty (or "/") and let dockerfilePath point into apps/.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

# The Dockerfile takes APP_VERSION as an ARG and bakes it into the binary.
# Railway exposes the commit SHA; wire it through so /health reports something
# meaningful instead of an empty string.
[build.args]
APP_VERSION = "${{RAILWAY_GIT_COMMIT_SHA}}"

[deploy]
# apps/api/src/main.rs serves GET /health — same path fly.toml checks.
healthcheckPath = "/health"
healthcheckTimeout = 30

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

numReplicas = 1

# Meeting streams are long-lived. fly.toml uses kill_timeout = 300 and an
# idle_timeout of 660s for exactly this reason. Give in-flight streams time to
# drain instead of cutting them at deploy.
overlapSeconds = 60
drainingSeconds = 300
